name: Desi Rush V1 Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  buildAndroid:
    name: Build Android APK 🏗️
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Unzip Unity Project
        run: |
          echo "Checking for zip..."
          ls -la
          if [ -f "DesiRush_V1_Final_Release_Package.zip" ]; then
            echo "Unzipping..."
            unzip -o DesiRush_V1_Final_Release_Package.zip -d ./UnityProject
            ls -la ./UnityProject
          else
            echo "Zip not found, assuming project is in root"
            mkdir -p ./UnityProject
            cp -r . ./UnityProject/ || true
          fi
          
          # Find where ProjectSettings is
          PROJECT_PATH=$(find ./UnityProject -name "ProjectSettings" -type d | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_PATH" ]; then
            PROJECT_PATH="./UnityProject"
          fi
          echo "PROJECT_PATH=$PROJECT_PATH" >> $GITHUB_ENV
          echo "Unity project path is: $PROJECT_PATH"
          cat "$PROJECT_PATH/ProjectSettings/ProjectVersion.txt" || echo "No version file"

      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-Android-${{ hashFiles('**/ProjectVersion.txt') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Free Disk Space
        run: |
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: Android
          # unityVersion: 2022.3.10f1  # Auto-detect karega, agar fail ho to uncomment karke apna version likh do
          androidVersionCode: ${{ github.run_number }}
          androidExportType: androidPackage
          buildsPath: build
          buildName: DesiRush-V1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DesiRush-V1-APK-${{ github.run_number }}
          path: |
            build/Android/*.apk
            build/**/*.apk
          retention-days: 30
          if-no-files-found: error
