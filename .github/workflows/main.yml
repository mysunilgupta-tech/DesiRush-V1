name: Get Unity License File
on:
  workflow_dispatch:
jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - uses: game-ci/unity-activator@v4
        with:
          unityVersion: 2022.3.62f1
      - uses: actions/upload-artifact@v4
        with:
          name: Manual Activation File
          path: "*.alf"
