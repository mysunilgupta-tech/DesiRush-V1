name: Get Unity License
on: workflow_dispatch
jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.0.50f1
      - uses: actions/upload-artifact@v4
        with:
          name: Unity-ALF
          path: "*.alf"
